name: Dentrix AI Test Automation & Security Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-automation-pipeline:
    name: Run Full Test Suite & Generate Dashboard
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Google Chrome
      uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: stable

    - name: Verify Chrome Version
      run: |
        chrome --version
        which google-chrome || which chrome

    - name: Install Dependencies
      run: |
        cd selenium-tests
        npm install

    - name: Run All Test Suites (Selenium, API, Appium, Load, Vulnerability)
      continue-on-error: true
      run: |
        cd selenium-tests
        npm test

    - name: Render GitHub Step Summary Dashboard
      if: always()
      run: |
        cd selenium-tests
        node generate-summary.js

    - name: Build Reports ZIP
      if: always()
      run: |
        mkdir -p zip_packaging/reports
        cp -r selenium-tests/reports/* zip_packaging/reports/
        cd zip_packaging
        zip -r ../Dentrix_AI_Test_Reports.zip reports
        cd ..

    - name: Upload Artifacts ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Dentrix_AI_Test_Reports
        path: Dentrix_AI_Test_Reports.zip
        retention-days: 14
